name: Build FileForge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.pal3241 --project-name fileforge

      - name: Set Android minSdk 24
        shell: python
        run: |
          from pathlib import Path
          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              path.write_text(text, encoding='utf-8')
              print(f'Updated {path}')

      - name: Remove generated template test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build universal APK
        run: flutter build apk --release

      - name: Save universal APK
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/FileForge-Android-universal.apk

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect split APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/FileForge-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/FileForge-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/FileForge-Android-x86_64.apk
          ls -lh dist/android

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: FileForge-Android
          path: dist/android/*.apk
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create . --platforms=windows --org com.pal3241 --project-name fileforge

      - name: Remove generated template test
        shell: pwsh
        run: if (Test-Path test) { Remove-Item test -Recurse -Force }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) {
            throw "Windows release folder not found: $release"
          }
          Compress-Archive -Path "$release\*" -DestinationPath 'FileForge-Windows-x64.zip' -Force
          Get-Item 'FileForge-Windows-x64.zip' | Format-List Name,Length

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: FileForge-Windows-x64
          path: FileForge-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
